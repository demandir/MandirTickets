name: Verify and deploy GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    outputs:
      staff_site_ready: ${{ steps.staff_site.outputs.ready }}
    env:
      VITE_GOOGLE_SCRIPT_URL: ${{ vars.VITE_GOOGLE_SCRIPT_URL }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install exact dependencies
        run: npm run setup
      - name: Audit production dependencies
        run: npm audit --omit=dev
      - name: Verify Apps Script deployment
        run: node scripts/verify-google-script.js
      - name: Run tests
        run: npm test
      - name: Test staff dashboard
        run: npm run test:staff
        env:
          CI: true
      - name: Build Pages site and staff dashboard
        run: npm run build:pages
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_GOOGLE_SCRIPT_URL: ${{ vars.VITE_GOOGLE_SCRIPT_URL }}
          VITE_STAFF_SITE_URL: ${{ vars.VITE_STAFF_SITE_URL }}
      - name: Check staff URL before publishing Pages
        if: github.ref == 'refs/heads/main'
        id: staff_site
        env:
          STAFF_SITE_URL: ${{ vars.VITE_STAFF_SITE_URL }}
        run: |
          if [[ "$STAFF_SITE_URL" =~ [^[:space:]] ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Pages deployment skipped. Set VITE_STAFF_SITE_URL and rerun this workflow."
          fi
      - name: Configure Pages
        if: steps.staff_site.outputs.ready == 'true'
        uses: actions/configure-pages@v6
      - name: Upload Pages artifact
        if: steps.staff_site.outputs.ready == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main' && needs.verify-and-build.outputs.staff_site_ready == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: verify-and-build
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v5
